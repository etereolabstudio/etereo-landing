    <!-- SISTEMA TIPOGRÁFICO: Clash Display (wordmark) / Outfit (lectura) / Space Mono (sello de cámara) -->
    <link href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>

    <style>
        /* =========================================
           1. DIRECCIÓN DE ARTE — REVELADO ANALÓGICO 90s
           Paleta extraída del ocaso: durazno / lavanda de bruma / crema
           ========================================= */
        :root {
            /* OCASO (Dark) */
            --bg-color: #121016;
            --bg-raise: #18161D;
            --text-color: #9B9488;
            --title-color: #EDE6D6;
            --nav-bg: rgba(18, 16, 22, 0.85);
            --card-border: rgba(237, 230, 214, 0.10);

            --accent: #DD8E5C;       /* durazno — el sol de la imagen */
            --accent-soft: #8B84A3;  /* lavanda — la bruma */

            --light-leak-1: rgba(221, 142, 92, 0.10);
            --light-leak-2: rgba(139, 132, 163, 0.08);

            --btn-bg: #EDE6D6;
            --btn-text: #121016;
            --film-grain: 0.13;
            --gallery-frame: #EDE6D6;
            --gallery-frame-text: rgba(18,16,22,0.5);
        }

        [data-theme="light"] {
            /* ALBA (Light) */
            --bg-color: #EAE3D3;
            --bg-raise: #F2ECDF;
            --text-color: #6B6459;
            --title-color: #1B1912;
            --nav-bg: rgba(234, 227, 211, 0.85);
            --card-border: rgba(27, 25, 18, 0.12);

            --accent: #C97440;
            --accent-soft: #6E6688;

            --light-leak-1: rgba(201, 116, 64, 0.10);
            --light-leak-2: rgba(110, 102, 136, 0.08);

            --btn-bg: #1B1912;
            --btn-text: #EAE3D3;
            --film-grain: 0.16;
            --gallery-frame: #FAF8F2;
            --gallery-frame-text: rgba(27,25,18,0.55);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Outfit', sans-serif;
            font-weight: 300;
            line-height: 1.6;
            overflow-x: hidden;
            transition: background-color 1s ease, color 1s ease;
        }

        /* LIGHT LEAKS + GRANO + VIÑETA */
        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: -2;
            background:
                radial-gradient(ellipse 45% 35% at 78% 18%, var(--light-leak-1) 0%, transparent 65%),
                radial-gradient(ellipse at -10% 115%, var(--light-leak-2) 0%, transparent 60%);
            transition: background 1s ease;
        }

        body::after {
            content: ''; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 9998; opacity: var(--film-grain); mix-blend-mode: overlay;
            background-image: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
            box-shadow: inset 0 0 12vw rgba(0,0,0,0.55);
            transition: opacity 1s ease;
        }

        #particles-js { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; opacity: 0.25; pointer-events: auto; }
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 10px; }

        h1, h2, h3, .nav-brand { font-family: 'Clash Display', sans-serif; font-weight: 600; color: var(--title-color); letter-spacing: 1px; text-transform: uppercase; transition: color 1s ease; }
        .romantic-text { font-family: 'Playfair Display', serif; font-style: italic; color: var(--title-color); }

        .mono, .timestamp, .eyebrow { font-family: 'Space Mono', monospace; letter-spacing: 1px; }
        .eyebrow { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 3px; color: var(--accent); }

        /* =========================================
           2. NAVEGACIÓN & PRELOADER RÁPIDO
           ========================================= */
        #preloader { position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background-color: var(--bg-color); z-index: 100000; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 10px; transition: opacity 0.55s ease, visibility 0.55s ease; animation: preloader-failsafe 0s linear 1.8s forwards; }
        @keyframes preloader-failsafe { to { opacity: 0; visibility: hidden; pointer-events: none; } }
        .preloader-text { font-family: 'Clash Display', sans-serif; font-size: clamp(1.2rem, 4vw, 2rem); color: var(--title-color); letter-spacing: 8px; animation: pulse-glow 2s infinite; text-transform: uppercase; }
        .preloader-code { font-family: 'Space Mono', monospace; font-size: 0.7rem; color: var(--accent); letter-spacing: 3px; }
        @keyframes pulse-glow { 0%, 100% { opacity: 0.3; filter: blur(2px); } 50% { opacity: 1; filter: blur(0); } }
        .preloader-hidden { opacity: 0 !important; visibility: hidden !important; pointer-events: none !important; }

        #scroll-progress { position: fixed; top: 0; left: 0; width: 0%; height: 2px; background: var(--accent); z-index: 100001; }

        .navbar { position: fixed; top: 0; width: 100%; padding: 18px 40px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; background: var(--nav-bg); backdrop-filter: blur(15px); border-bottom: 1px solid var(--card-border); z-index: 9999; transition: transform 0.5s ease; }
        .navbar.nav-hidden { transform: translateY(-100%); }
        .nav-brand { font-size: clamp(1rem, 2vw, 1.3rem); letter-spacing: 4px; justify-self: start; text-decoration: none; }
        .nav-links { display: flex; align-items: center; justify-content: center; gap: 24px; }
        .nav-links a { color: var(--text-color); text-decoration: none; font-family: 'Space Mono', monospace; font-size: 0.62rem; letter-spacing: 1.5px; text-transform: uppercase; transition: color 0.3s ease; }
        .nav-links a:hover { color: var(--accent); }
        .nav-actions { justify-self: end; display: flex; align-items: center; gap: 10px; }
        .nav-menu-btn { display: none; background: transparent; color: var(--title-color); border: 1px solid var(--card-border); width: 34px; height: 34px; align-items: center; justify-content: center; cursor: pointer; border-radius: 2px; }
        .mobile-nav-panel { display: none; }

        .theme-btn { background: transparent; color: var(--title-color); border: 1px solid var(--card-border); padding: 6px 14px; font-family: 'Space Mono', monospace; font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: 0.4s; border-radius: 2px; }
        .theme-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* =========================================
           3. HERO — ENRUTADOR DE TRÁFICO (CRO)
           ========================================= */
        .hero { min-height: 92vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 90px 20px 50px; z-index: 10; position: relative; }

        .hero-frame-mark { position: absolute; font-family: 'Space Mono', monospace; font-size: 0.65rem; letter-spacing: 2px; color: var(--text-color); opacity: 0.55; }
        .hero-frame-mark.tl { top: 90px; left: 30px; }
        .hero-frame-mark.br { bottom: 30px; right: 30px; text-align: right; }

        .hero h1 {
            font-size: clamp(3.2rem, 14vw, 9.5rem);
            letter-spacing: 0.05em;
            margin-bottom: 5px;
            transform: scaleX(1.05);
            line-height: 1;
        }

        .subtitle-hero {
            font-family: 'Space Mono', monospace;
            letter-spacing: 0.5em;
            text-transform: uppercase;
            font-size: clamp(0.6rem, 1.5vw, 0.9rem);
            color: var(--accent);
            margin-right: -0.5em;
        }
        .hero-copy { max-width: 660px; margin-top: 20px; font-size: clamp(0.95rem, 2vw, 1.08rem); color: var(--text-color); opacity: 0.9; }

        /* PÍLDORAS DE ACCESO RÁPIDO PARA TRÁFICO DE REELS */
        .hero-quick-pills {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-top: 28px;
            max-width: 780px;
        }
        .quick-pill {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            padding: 11px 16px;
            background: var(--bg-raise);
            border: 1px solid var(--card-border);
            color: var(--title-color);
            text-decoration: none;
            font-family: 'Space Mono', monospace;
            font-size: 0.66rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            border-radius: 2px;
            transition: all 0.3s ease;
        }
        .quick-pill strong { color: var(--accent); font-weight: 700; }
        .quick-pill:hover { border-color: var(--accent); transform: translateY(-2px); }
        .quick-pill.highlight { border-color: rgba(221, 142, 92, 0.45); background: linear-gradient(90deg, var(--light-leak-1), var(--bg-raise)); }

        .hero-trust-bar {
            margin-top: 26px;
            font-family: 'Space Mono', monospace;
            font-size: 0.62rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-color);
            opacity: 0.75;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }
        .hero-trust-bar span { display: inline-flex; align-items: center; gap: 6px; }
        .hero-trust-bar i, .hero-trust-bar svg { color: var(--accent); }

        /* =========================================
           4. SECCIONES DE PORTAFOLIO Y PRODUCTOS
           ========================================= */
        section.portfolio-section { padding: 10px 20px 80px; max-width: 1200px; margin: 0 auto; }

        h2.section-title { font-size: clamp(1.6rem, 4vw, 2rem); letter-spacing: 2px; margin-bottom: 10px; text-align: center; }

        .section-divider { margin: 80px 0 50px 0; text-align: left; display: flex; align-items: baseline; gap: 20px; scroll-margin-top: 90px; }
        .section-divider::after { content: ''; flex: 1; height: 1px; background: var(--card-border); }
        .section-divider .eyebrow { white-space: nowrap; }
        .section-divider h2 { font-size: clamp(1.5rem, 4vw, 2rem); color: var(--title-color); margin: 0; letter-spacing: 2px; }

        .collection-grid { display: flex; flex-direction: column; gap: 40px; margin-bottom: 100px; align-items: center; width: 100%; }

        @media (min-width: 900px) {
            .collection-grid { display: grid; grid-template-columns: 1.15fr 1fr; gap: 80px; margin-bottom: 125px; align-items: center;}
            .collection-grid:nth-child(even) .img-container,
            .collection-grid:nth-child(even) .carousel-wrapper,
            .collection-grid:nth-child(even) .feature-wrapper { order: 2; }
            .collection-grid:nth-child(even) .text-container { order: 1; }
        }

        .text-container { display: flex; flex-direction: column; justify-content: center; }
        .text-container .eyebrow { margin-bottom: 12px; }
        .text-container h3 { font-size: clamp(1.7rem, 4vw, 2.2rem); margin-bottom: 15px; line-height: 1.1; letter-spacing: 1px; }
        .text-container p { margin-bottom: 15px; font-size: 0.98rem; opacity: 0.85; }

        .price-badge { align-self: flex-start; background: var(--btn-bg); color: var(--btn-text); padding: 14px 26px; font-size: 0.74rem; font-weight: 700; border-radius: 2px; margin-top: 12px; font-family: 'Space Mono', monospace; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.3s; border: 1px solid var(--btn-bg); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
        .price-badge:hover { background: transparent; color: var(--title-color); border-color: var(--title-color); }
        
        .secondary-action-link { display:inline-flex; align-items:center; gap:7px; padding:13px 18px; color:var(--accent); text-decoration:none; border:1px solid var(--card-border); font-family:'Space Mono',monospace; font-size:.68rem; letter-spacing:1.5px; text-transform:uppercase; border-radius:2px; transition:.3s; }
        .secondary-action-link:hover { border-color:var(--accent); color:var(--title-color); }

        /* TABLA DE PRECIOS E INTERACTIVIDAD CRO (PET ID + ARTE) */
        .price-table { width: 100%; margin-top: 16px; border-top: 1px solid var(--card-border); }
        .price-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 10px; border-bottom: 1px solid var(--card-border); font-family: 'Space Mono', monospace; width: 100%; background: transparent; border-left: none; border-right: none; border-top: none; text-align: left; transition: background 0.25s ease, border-color 0.25s ease; }
        button.price-row { cursor: pointer; }
        button.price-row:hover { background: var(--bg-raise); }
        
        /* Efecto Señuelo: Destacar la opción de $149 MXN */
        .price-row.recommended {
            background: linear-gradient(90deg, var(--light-leak-1) 0%, transparent 100%);
            border-left: 2px solid var(--accent);
            padding-left: 14px;
        }
        .badge-popular {
            display: inline-block;
            background: var(--accent);
            color: #121016;
            font-family: 'Space Mono', monospace;
            font-size: 0.55rem;
            font-weight: 700;
            padding: 2px 6px;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-left: 8px;
            border-radius: 1px;
            vertical-align: middle;
        }

        .price-row .fmt { font-size: 0.8rem; color: var(--title-color); letter-spacing: 0.5px; }
        .price-row .fmt small { display: block; color: var(--text-color); opacity: 0.78; font-size: 0.7rem; margin-top: 3px; letter-spacing: 0; font-family: 'Outfit', sans-serif; }
        .price-row .val { font-size: 0.86rem; color: var(--title-color); font-weight: 700; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
        .price-row .val svg { color: var(--accent); opacity: 0.8; transition: transform 0.2s ease; }
        button.price-row:hover .val svg { transform: translateX(3px); opacity: 1; }
        .price-row.digital .fmt, .price-row.digital .val { opacity: 0.7; }

        /* Recordatorio de precio junto al botón de cuadros */
        .inline-price-anchor {
            margin-top: 16px;
            margin-bottom: 4px;
            font-family: 'Space Mono', monospace;
            font-size: 0.72rem;
            color: var(--text-color);
            letter-spacing: 0.5px;
        }
        .inline-price-anchor strong { color: var(--title-color); }

        .scarcity-ribbon { display: flex; align-items: center; justify-content: center; gap: 10px; margin: -10px 0 50px; padding: 12px; border-top: 1px solid var(--card-border); border-bottom: 1px solid var(--card-border); font-family: 'Space Mono', monospace; font-size: 0.7rem; color: var(--accent); letter-spacing: 0.5px; text-align: center; flex-wrap: wrap; }
        .scarcity-note { display: flex; align-items: center; gap: 8px; margin-top: 14px; font-family: 'Space Mono', monospace; font-size: 0.68rem; color: var(--accent); letter-spacing: 0.5px; opacity: 0.9; }

        /* IMÁGENES: FOTOGRAMA REVELADO */
        .carousel-wrapper { width: 100%; position: relative; overflow: hidden; }
        .carousel { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scroll-behavior: smooth; gap: 20px; scrollbar-width: none; -ms-overflow-style: none; padding-bottom: 15px; }
        .carousel::-webkit-scrollbar { display: none; }
        .carousel-slide { flex: 0 0 100%; scroll-snap-align: center; position: relative; width: 100%; }

        .img-container { width: 100%; border-radius: 2px; overflow: hidden; box-shadow: 0 20px 45px rgba(0,0,0,0.35); position: relative; transition: 1s ease; }
        .img-square { height: auto; width: 100%; aspect-ratio: 1 / 1; overflow: hidden; background: #000; position: relative; }
        .img-square img { object-fit: contain; width: 100%; height: 100%; filter: sepia(0.12) contrast(1.06) saturate(0.92) brightness(0.96); transform: scale(1.035); transition: transform 2.2s cubic-bezier(0.22, 1, 0.36, 1); }
        .img-square.developed img { transform: scale(1); }
        .img-square:hover.developed img { transform: scale(1.03); }

        .img-develop-veil { position: absolute; inset: 0; z-index: 3; background: var(--gallery-frame); opacity: 1; pointer-events: none; transition: opacity 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.1s; }
        .img-square.developed .img-develop-veil { opacity: 0; }

        .cam-stamp { position: absolute; bottom: 10px; right: 12px; font-family: 'Space Mono', monospace; font-size: 0.62rem; letter-spacing: 1px; color: var(--accent); opacity: 0.85; text-shadow: 0 0 6px rgba(0,0,0,0.4); pointer-events: none; }

        .slide-caption { margin-top: 12px; padding: 0 2px; text-align: left; font-family: 'Space Mono', monospace; font-size: 0.65rem; color: var(--text-color); opacity: 0.7; letter-spacing: 1.5px; text-transform: uppercase; }
        .swipe-indicator { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 0.68rem; color: var(--text-color); letter-spacing: 1px; justify-content: center; font-family: 'Space Mono', monospace; }

        /* MIXTAPE ESTILOS */
        .mixtape-includes { font-family: 'Space Mono', monospace; font-size: .66rem !important; letter-spacing: .6px; color: var(--text-color); opacity: .78 !important; margin-top: 8px !important; }
        .mixtape-includes strong { color: var(--accent); font-weight: 400; }
        .mixtape-lead { margin-top: 5px; font-family: 'Playfair Display', serif; font-style: italic; color: var(--title-color); font-size: 1.05rem; }
        .mixtape-lead strong { color: var(--accent); font-weight: 400; }
        .mixtape-image img { width: 100%; height: 100%; display: block; object-fit: contain; padding: 0; background: transparent; }
        .mixtape-meta { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 10px; }
        .mixtape-meta span { font-family: 'Space Mono', monospace; font-size: .62rem; letter-spacing: 1.4px; border: 1px solid var(--card-border); color: var(--accent); padding: 7px 9px; background: var(--bg-raise); }
        .mixtape-detail { font-size: .88rem !important; opacity: .75 !important; margin-top: 5px; }
        .mixtape-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 14px; }
        .mixtape-actions .price-badge { margin-top: 0; }

        [data-product-key].is-unavailable {
            opacity: .48 !important;
            pointer-events: none;
            cursor: not-allowed !important;
            text-decoration: none !important;
        }
        .availability-note {
            display: none;
            margin-top: 10px;
            font-family: 'Space Mono', monospace;
            font-size: .62rem;
            letter-spacing: 1px;
            color: var(--text-color);
            opacity: .72;
            text-transform: uppercase;
        }
        .availability-note.visible { display: block; }

        /* REPRODUCTOR DE AUDIO */
        .audio-player-wrapper { margin-top: 18px; padding: 22px; border: 1px solid var(--card-border); border-radius: 2px; background: var(--bg-raise); position: relative; }
        .waveform-wrapper { width: 100%; height: 50px; margin-bottom: 15px; }
        #waveform-real { width: 100%; height: 100%; }
        .play-controls { display: flex; align-items: center; gap: 15px; }
        .play-btn-custom { background: var(--accent); border: none; border-radius: 50%; width: 40px; height: 40px; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.3s; flex-shrink: 0; }
        .play-btn-custom:hover { transform: scale(1.05); opacity: 0.9; }
        .play-btn-custom svg { fill: var(--bg-color); width: 14px; margin-left: 2px; transition: 0.3s; }
        .audio-status { font-family: 'Space Mono', monospace; font-size: 0.78rem; color: var(--title-color); opacity: 0.9; }

        /* COMPLEMENTOS INTERACTIVOS */
        .complements-section { max-width: 980px; margin: 10px auto 90px; padding: 40px 20px 0; }
        .complements-head { text-align: center; max-width: 720px; margin: 0 auto 42px; }
        .complements-head h2 { margin-top: 6px; }
        .complements-head p { margin-top: 14px; font-size: .95rem; opacity: .8; }
        .complements-list { border-top: 1px solid var(--card-border); }
        .complement-item { border-bottom: 1px solid var(--card-border); }
        .complement-toggle { width: 100%; border: 0; background: transparent; color: var(--title-color); padding: 19px 0; display: flex; align-items: center; justify-content: space-between; gap: 20px; cursor: pointer; text-align: left; }
        .complement-toggle:hover .complement-toggle-main strong { color: var(--accent); }
        .complement-toggle-main { display: flex; align-items: center; gap: 16px; min-width: 0; }
        .complement-toggle-main > span:last-child { display: flex; flex-direction: column; min-width: 0; }
        .complement-toggle-main strong { font-family: 'Outfit', sans-serif; font-size: 1rem; font-weight: 400; transition: color .25s ease; }
